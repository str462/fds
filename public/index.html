<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бронювання</title>
<link rel="stylesheet" href="/style.css?v=7">
</head>
<body class="ref-theme">
<div class="hearts" aria-hidden="true"><span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span></div>

<div class="lang-switch" id="langSwitch">
  <button type="button" data-lang="uk" class="active">UA</button>
  <button type="button" data-lang="en">EN</button>
</div>

<main class="ref-page landing-page">
  <section class="ref-card landing-card">
    <div class="ref-label"><span>♡</span> <span data-i18n="label">Бронювання</span></div>
    <h1 data-i18n="title">Підтвердіть оплату за<br>бронювання</h1>

    <div class="ref-price">$3.00 <span data-i18n="priceHint">USD · одноразово</span></div>

    <div class="ref-rule"></div>

    <div class="ref-points">
      <div><i>✓</i><span data-i18n="p1">Захищена обробка даних</span></div>
      <div><i>✓</i><span data-i18n="p2">Миттєве підтвердження бронювання</span></div>
      <div><i>✓</i><span data-i18n="p3">Вартість бронювання — $3.00</span></div>
    </div>

    <a class="ref-cta" href="/booking.html" id="startBooking" data-i18n="cta">Продовжити</a>

    <p class="ref-foot" data-i18n="foot">
      Це одноразова оплата за бронювання, додаткові платежі лише за домовленістю.
    </p>
  </section>
</main>

<script>
const I18N = {
  uk: {
    label: "Бронювання",
    title: "Підтвердіть оплату за<br>бронювання",
    priceHint: "USD · одноразово",
    p1: "Захищена обробка даних",
    p2: "Миттєве підтвердження бронювання",
    p3: "Вартість бронювання — $3.00",
    cta: "Продовжити",
    foot: "Це одноразова оплата за бронювання, додаткові платежі лише за домовленістю.",
    docTitle: "Бронювання"
  },
  en: {
    label: "Booking",
    title: "Confirm payment for<br>your booking",
    priceHint: "USD · one-time",
    p1: "Secure data processing",
    p2: "Instant booking confirmation",
    p3: "Booking fee — $3.00",
    cta: "Continue",
    foot: "This is a one-time booking payment. Additional charges only by agreement.",
    docTitle: "Booking"
  }
};

function applyLang(lang){
  const t = I18N[lang] || I18N.uk;
  document.documentElement.lang = lang === "en" ? "en" : "uk";
  document.title = t.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(t[key] != null) el.innerHTML = t[key];
  });
  document.querySelectorAll("#langSwitch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  localStorage.setItem("fitpass_lang", lang);
}

document.querySelectorAll("#langSwitch button").forEach(b=>{
  b.addEventListener("click", ()=>applyLang(b.dataset.lang));
});

document.getElementById("startBooking").addEventListener("click",()=>{
  localStorage.removeItem("fitpass_lead_id");
});

applyLang(localStorage.getItem("fitpass_lang") || "uk");
</script>
</body>
</html>
