<script>
const I18N = {
  uk: {
    label: "Бронювання",
    title: "Підтвердіть оплату за<br>бронювання",
    priceHint: "USD · одноразово",
    p1: "Захищена обробка даних",
    p2: "Миттєве підтвердження бронювання",
    p3: "Безпечна оплата",
    cta: "Продовжити",
    foot: "Це одноразова оплата $3.00 за бронювання. Додаткові платежі лише за домовленістю.",
    docTitle: "Бронювання"
  },
  en: {
    label: "Booking",
    title: "Confirm payment for<br>your booking",
    priceHint: "USD · one-time",
    p1: "Secure data processing",
    p2: "Instant booking confirmation",
    p3: "Secure payment",
    cta: "Continue",
    foot: "This is a one-time $3.00 booking payment. Additional charges only by agreement.",
    docTitle: "Booking"
  }
};

function applyLang(lang){
  const t = I18N[lang] || I18N.uk;
  document.documentElement.lang = lang === "en" ? "en" : "uk";
  document.title = t.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(t[key] != null) el.innerHTML = t[key];
  });
  document.querySelectorAll("#langSwitch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  localStorage.setItem("fitpass_lang", lang);
}

document.querySelectorAll("#langSwitch button").forEach(b=>{
  b.addEventListener("click", ()=>applyLang(b.dataset.lang));
});

document.getElementById("startBooking").addEventListener("click",()=>{
  localStorage.removeItem("fitpass_lead_id");
});

applyLang(localStorage.getItem("fitpass_lang") || "uk");
</script>
