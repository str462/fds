<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка доступа</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
        }
        .error-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #d9534f; }
        p { font-size: 18px; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>403 Forbidden</h1>
        <p>Доступ к этому ресурсу запрещен.</p>
        <p>Ваш браузер или инструмент не поддерживается.</p>
        <p><small>Если вы используете бота, AI или парсер, вы можете не получить ожидаемый контент.</small></p>
    </div>
</body>
</html>
